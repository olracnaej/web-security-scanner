  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Web Security Scanner...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Web Security Scanner<\u002Ftitle>\n<script src=\"d826a375-9870-4901-81c7-eaaba602da3b\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"3600\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n*{box-sizing:border-box}\na{color:#0a5c66}a:hover{color:#06404a}\na:focus-visible{outline:3px solid #0a5c66;outline-offset:3px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: #f6f8fa; color: #12202b; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.6\" data-canvas-width=\"1280\" data-canvas-height=\"3600\" data-document-role=\"page\" data-label=\"Project page\">\n\n<header style=\"max-width: 1080px; margin: 0 auto; padding: 4.5rem 1.5rem 3rem\">\n<p style=\"margin: 0 0 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.875rem; color: #0a5c66; letter-spacing: 0.04em\">PYTHON · CYBERSECURITY PROJECT<\u002Fp>\n<h1 style=\"margin: 0 0 1.25rem; font-size: clamp(2.25rem, 6vw, 3.75rem); line-height: 1.08; font-weight: 600; letter-spacing: -0.02em\">Web Security Scanner<\u002Fh1>\n<p style=\"margin: 0 0 2rem; max-width: 40rem; font-size: 1.25rem; color: #3a4857\">A command-line tool that checks a small business website for common security problems, gives it a score from 0 to 100, and explains how to fix each issue.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 0.875rem\">\n<a href=\"https://github.com/olracnaej/web-security-scanner\" style=\"display: inline-block; padding: 0.875rem 1.5rem; background: #0a5c66; color: #ffffff; text-decoration: none; font-weight: 500; border-radius: 8px; min-height: 44px\">View the code on GitHub<\u002Fa>\n<a href=\"#score\" style=\"display: inline-block; padding: 0.875rem 1.5rem; border: 2px solid #0a5c66; color: #0a5c66; text-decoration: none; font-weight: 500; border-radius: 8px; min-height: 44px\">See how it scores<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section aria-label=\"Project facts\" style=\"max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 3rem\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem\">\n<div style=\"background: #ffffff; border: 1px solid #d8dee4; border-radius: 12px; padding: 1.25rem 1.5rem\">\n<p style=\"margin: 0; font-size: 2.25rem; font-weight: 600; line-height: 1.1\">5<\u002Fp>\n<p style=\"margin: 0.25rem 0 0; color: #52606d\">areas checked<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #d8dee4; border-radius: 12px; padding: 1.25rem 1.5rem\">\n<p style=\"margin: 0; font-size: 2.25rem; font-weight: 600; line-height: 1.1\">145<\u002Fp>\n<p style=\"margin: 0.25rem 0 0; color: #52606d\">automated tests<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #d8dee4; border-radius: 12px; padding: 1.25rem 1.5rem\">\n<p style=\"margin: 0; font-size: 2.25rem; font-weight: 600; line-height: 1.1\">0<\u002Fp>\n<p style=\"margin: 0.25rem 0 0; color: #52606d\">runtime dependencies<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #d8dee4; border-radius: 12px; padding: 1.25rem 1.5rem\">\n<p style=\"margin: 0; font-size: 2.25rem; font-weight: 600; line-height: 1.1\">3<\u002Fp>\n<p style=\"margin: 0.25rem 0 0; color: #52606d\">practice sites<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 3rem; align-items: center\">\n<div>\n<h2 style=\"margin: 0 0 1rem; font-size: 1.75rem; line-height: 1.2; font-weight: 600\">What a scan produces<\u002Fh2>\n<p style=\"margin: 0 0 1rem; color: #3a4857\">Every scan ends with a grade, a count of problems by severity, and one card per finding. Each card says why it matters and what to change.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 1.25rem; color: #3a4857\">\n<li style=\"margin-bottom: 0.5rem\">A score and a letter grade from A to F<\u002Fli>\n<li style=\"margin-bottom: 0.5rem\">An HTML report you can open in a browser, and a JSON report for scripts<\u002Fli>\n<li style=\"margin-bottom: 0.5rem\">Plain-language fixes next to every finding<\u002Fli>\n<li>Cookie values and file contents are never stored or shown<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div>\n<img src=\"63e6071e-2f4e-42f0-b1e2-59d19dc53262\" alt=\"HTML report for a practice site: grade F, 0 out of 100, four high findings, each with a fix\" style=\"display: block; width: 100%; max-width: 520px; margin: 0 auto; border: 1px solid #d8dee4; border-radius: 12px\">\n<p style=\"margin: 0.75rem auto 0; max-width: 520px; font-size: 0.875rem; color: #52606d\">The report for a practice site with deliberate mistakes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; border-top: 1px solid #d8dee4; border-bottom: 1px solid #d8dee4\">\n<div style=\"max-width: 1080px; margin: 0 auto; padding: 4rem 1.5rem\">\n<h2 style=\"margin: 0 0 0.5rem; font-size: 1.75rem; line-height: 1.2; font-weight: 600\">What it checks<\u002Fh2>\n<p style=\"margin: 0 0 2rem; color: #3a4857\">Five areas, each with its own tests.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem\">\n<div style=\"padding: 1.5rem; background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 12px\">\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600\">Security headers<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">HSTS, Content-Security-Policy, clickjacking protection, nosniff, Referrer-Policy and software versions leaked in headers.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 1.5rem; background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 12px\">\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600\">Cookies<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Secure, HttpOnly and SameSite flags on every cookie. Session-like cookies are rated more strictly.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 1.5rem; background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 12px\">\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600\">TLS<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Expired, self-signed or mismatched certificates, certificates about to expire, obsolete TLS 1.0 and 1.1, and a missing redirect from HTTP to HTTPS.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 1.5rem; background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 12px\">\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600\">Exposed files<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Public .git folders, .env files, backups, SQL dumps, phpinfo pages and directory listings, confirmed by their content and not only by a 200 response.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 1.5rem; background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 12px\">\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600\">WordPress<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Outdated core, public user list, xmlrpc.php, leaked wp-config backups, debug logs and visible plugins. Runs only on WordPress sites.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1080px; margin: 0 auto; padding: 4rem 1.5rem\">\n<h2 style=\"margin: 0 0 0.5rem; font-size: 1.75rem; line-height: 1.2; font-weight: 600\">Built to be safe to run<\u002Fh2>\n<p style=\"margin: 0 0 2rem; max-width: 40rem; color: #3a4857\">A security tool should not become a risk itself, so the guard runs before any request is sent.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem\">\n<div>\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 600\">Permission first<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">It scans localhost by default. Any other site must be named explicitly with <code style=\"font-family: 'IBM Plex Mono', monospace; font-size: 0.9em\">--allow-host<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 600\">No dangerous targets<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Cloud metadata addresses are always refused, even if allowed, and redirects to other hosts are never followed.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 600\">Gentle<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">About 30 to 50 requests per scan, with a pause between them and a hard cap of 80.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 600\">Safe reports<\u002Fh3>\n<p style=\"margin: 0; color: #3a4857\">Nothing a site controls reaches the HTML report unescaped, and the report carries its own strict Content-Security-Policy.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"score\" style=\"background: #ffffff; border-top: 1px solid #d8dee4; border-bottom: 1px solid #d8dee4\">\n<div style=\"max-width: 1080px; margin: 0 auto; padding: 4rem 1.5rem\">\n<h2 style=\"margin: 0 0 0.5rem; font-size: 1.75rem; line-height: 1.2; font-weight: 600\">How the score works<\u002Fh2>\n<p style=\"margin: 0 0 2rem; max-width: 42rem; color: #3a4857\">The rules are simple on purpose, so anyone can see why a site got a C.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2.5rem\">\n<div>\n<p style=\"margin: 0 0 0.75rem\"><strong>Start at 100, then subtract:<\u002Fstrong><\u002Fp>\n<ul style=\"margin: 0; padding-left: 1.25rem; color: #3a4857\">\n<li style=\"margin-bottom: 0.5rem\">20 for each high problem<\u002Fli>\n<li style=\"margin-bottom: 0.5rem\">8 for each medium problem<\u002Fli>\n<li style=\"margin-bottom: 0.5rem\">3 for each low problem<\u002Fli>\n<li>0 for info<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 1rem 0 0; color: #3a4857\">Each type of problem counts once, however many places it appears. Any high finding caps the grade at D.<\u002Fp>\n<\u002Fdiv>\n<div>\n<p style=\"margin: 0 0 0.75rem\"><strong>Grades:<\u002Fstrong><\u002Fp>\n<sc-raw-table style=\"border-collapse: collapse; width: 100%; max-width: 320px\">\n<sc-raw-tr><sc-raw-th scope=\"col\" style=\"padding: 0.5rem 0.75rem; text-align: left; border-bottom: 2px solid #d8dee4\">Grade<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 0.5rem 0.75rem; text-align: left; border-bottom: 2px solid #d8dee4\">Score<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">A<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">90 and up<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">B<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">80 to 89<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">C<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">70 to 79<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">D<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.5rem 0.75rem; border-bottom: 1px solid #d8dee4\">60 to 69<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 0.5rem 0.75rem\">F<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.5rem 0.75rem\">below 60<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1080px; margin: 0 auto; padding: 4rem 1.5rem\">\n<h2 style=\"margin: 0 0 0.5rem; font-size: 1.75rem; line-height: 1.2; font-weight: 600\">Practice sites<\u002Fh2>\n<p style=\"margin: 0 0 2rem; max-width: 42rem; color: #3a4857\">Three fake sites with deliberate mistakes ship with the project. The tests check that each one produces exactly its documented findings.<\u002Fp>\n<div style=\"overflow-x: auto\">\n<sc-raw-table style=\"border-collapse: collapse; width: 100%; min-width: 640px; background: #ffffff; border: 1px solid #d8dee4\">\n<sc-raw-tr>\n<sc-raw-th scope=\"col\" style=\"padding: 0.75rem 1rem; text-align: left; border-bottom: 2px solid #d8dee4\">Site<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 0.75rem 1rem; text-align: left; border-bottom: 2px solid #d8dee4\">What it shows<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 0.75rem 1rem; text-align: left; border-bottom: 2px solid #d8dee4\">Findings<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 0.75rem 1rem; text-align: left; border-bottom: 2px solid #d8dee4\">Score<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4; font-family: 'IBM Plex Mono', monospace\">bare<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4\">No security headers, version leaks, cookies without flags<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4\">5 medium, 7 low, 1 info<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4; color: #b42318; font-weight: 600\">53, grade F<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4; font-family: 'IBM Plex Mono', monospace\">leaky<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4\">Exposed .git, .env, SQL dump, backup zip, phpinfo and a directory listing<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4\">4 high, 4 medium, 3 low, 1 info<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; border-bottom: 1px solid #d8dee4; color: #b42318; font-weight: 600\">0, grade F<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td style=\"padding: 0.75rem 1rem; font-family: 'IBM Plex Mono', monospace\">wordpress<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem\">Old WordPress with public users, xmlrpc and a leaked wp-config backup<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem\">1 high, 6 medium, 9 low, 3 info<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 0.75rem 1rem; color: #b42318; font-weight: 600\">5, grade F<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"margin: 1rem 0 0; font-size: 0.9375rem; color: #52606d\">All three sites listen on 127.0.0.1 only, and every password in them is fake.<\u002Fp>\n<\u002Fsection>\n\n<footer style=\"background: #12202b; color: #e6ebf0\">\n<div style=\"max-width: 1080px; margin: 0 auto; padding: 3rem 1.5rem\">\n<p style=\"margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 500\">Built by Jean Carlo Andrade Rojas<\u002Fp>\n<p style=\"margin: 0 0 1.25rem; color: #b8c4d0\">Computer Systems Engineering student, Costa Rica<\u002Fp>\n<p style=\"margin: 0 0 1.5rem\"><a href=\"https://github.com/olracnaej/web-security-scanner\" style=\"color: #ffffff\">github.com/olracnaej/web-security-scanner<\u002Fa><\u002Fp>\n<p style=\"margin: 0; font-size: 0.9375rem; color: #b8c4d0\">Only scan sites you own or have written permission to test.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3600}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
